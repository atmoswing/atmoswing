name: Windows release

on:
  release:
    types: [created]

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

jobs:
  build-server-version:
    runs-on: windows-2022

    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache/windows-server-vs2022-release
      FETCHCONTENT_CACHE_KEY: windows-server-vs2022-release

    steps:
      - uses: actions/checkout@v6

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ env.FETCHCONTENT_CACHE_KEY }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'build/cmake/**', 'build/patches/**') }}

      - name: Cache vcpkg downloads (distfiles)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-downloads-

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DCMAKE_FETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=OFF
             -DUSE_GUI=OFF
             -DBUILD_TESTS=OFF
             -DCREATE_INSTALLER=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Make installer
        working-directory: ${{github.workspace}}/build
        run: |
          cpack -C ${{env.BUILD_TYPE}} -G ZIP
          cpack -C ${{env.BUILD_TYPE}} -G WIX

      - name: Upload release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/*.zip;build/*.msi"
          tags: true
          draft: true
          verbose: true


  build-desktop-version:
    runs-on: windows-2022

    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache/windows-desktop-vs2022-release
      FETCHCONTENT_CACHE_KEY: windows-desktop-vs2022-release

    steps:
      - uses: actions/checkout@v6

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ env.FETCHCONTENT_CACHE_KEY }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'build/cmake/**', 'build/patches/**') }}

      - name: Cache vcpkg downloads (distfiles)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-downloads-

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DCMAKE_FETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=ON
             -DUSE_GUI=ON
             -DBUILD_TESTS=OFF
             -DCREATE_INSTALLER=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Make installer
        working-directory: ${{github.workspace}}/build
        run: |
          cpack -C ${{env.BUILD_TYPE}} -G ZIP
          cpack -C ${{env.BUILD_TYPE}} -G WIX

      - name: Upload release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/*.zip;build/*.msi"
          tags: true
          draft: true
          verbose: true
