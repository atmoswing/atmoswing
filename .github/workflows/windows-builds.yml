name: Windows builds

on:
  push:
    branches-ignore:
      - ci/coverage-gui

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build-server-version:
    runs-on: windows-2022

    env:
      ECCODES_DEFINITION_PATH: ${{github.workspace}}/build/share/eccodes/definitions

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=OFF
             -DUSE_GUI=OFF
             -DBUILD_TESTS=ON
             -DCREATE_INSTALLER=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ./tests/${{env.BUILD_TYPE}}/atmoswing-tests.exe

      - name: Make installer
        working-directory: ${{github.workspace}}/build
        run: |
          cpack -C ${{env.BUILD_TYPE}} -G ZIP
          cpack -C ${{env.BUILD_TYPE}} -G WIX


  build-desktop-version:
    runs-on: windows-2022

    env:
      ECCODES_DEFINITION_PATH: ${{github.workspace}}/build/share/eccodes/definitions
      PROJ_DATA: ${{github.workspace}}/build/share/proj
      PROJ_LIB: ${{github.workspace}}/build/share/proj

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=ON
             -DUSE_GUI=ON
             -DBUILD_TESTS=OFF
             -DCREATE_INSTALLER=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Make installer
        working-directory: ${{github.workspace}}/build
        run: |
          cpack -C ${{env.BUILD_TYPE}} -G ZIP
          cpack -C ${{env.BUILD_TYPE}} -G WIX
