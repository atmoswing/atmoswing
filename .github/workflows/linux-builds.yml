name: Linux builds

on:
  push:
    branches-ignore:
      - ci/coverage-gui

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build-server-version:
    runs-on: ubuntu-22.04

    env:
      ECCODES_DEFINITION_PATH: ${{github.workspace}}/build/share/eccodes/definitions

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies for vcpkg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G Ninja
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=OFF
             -DUSE_GUI=OFF
             -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ./tests/atmoswing-tests


  build-desktop-version:
    runs-on: ubuntu-22.04

    env:
      ECCODES_DEFINITION_PATH: ${{github.workspace}}/build/share/eccodes/definitions
      PROJ_DATA: ${{github.workspace}}/build/share/proj
      PROJ_LIB: ${{github.workspace}}/build/share/proj

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libgtk-3-0 libgtk-3-dev libx11-dev libx11-xcb-dev xvfb

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G Ninja
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=ON
             -DUSE_GUI=ON
             -DBUILD_TESTS=ON
             -DTEST_GUI=ON

      - name: Build
        run: cmake --build build

      - name: Test (using xvfb)
        working-directory: ${{github.workspace}}/build
        run: xvfb-run --server-args="-screen 0, 1280x720x24" -a ./tests/atmoswing-tests
