name: Coverity scan

on:
  push:
    branches:
    - ci/code-analysis

env:
  BUILD_TYPE: RelWithDebInfo
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

jobs:
  coverity-scan:
    name: Coverity scan

    runs-on: ubuntu-26.04

    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache/linux-coverity-make-relwithdebinfo
      FETCHCONTENT_CACHE_KEY: linux-coverity-make-relwithdebinfo

    steps:
      - uses: actions/checkout@v6

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ env.FETCHCONTENT_CACHE_KEY }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'build/cmake/**', 'build/patches/**') }}

      - name: Cache vcpkg downloads (distfiles)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-downloads-

      - name: Install system build dependencies for vcpkg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Unix Makefiles"
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DCMAKE_FETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=OFF
             -DUSE_GUI=OFF
             -DBUILD_TESTS=ON

      - uses: vapier/coverity-scan-action@v1
        with:
          email: ${{secrets.COVERITY_SCAN_EMAIL}}
          token: ${{secrets.COVERITY_SCAN_TOKEN}}
          working-directory: ${{github.workspace}}/build
          command: make -j $(nproc)
