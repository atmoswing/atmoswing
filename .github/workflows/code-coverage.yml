name: Code coverage

on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - ci/coverage-gui

env:
  BUILD_TYPE: RelWithDebInfo
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

jobs:
  code-coverage:
    runs-on: ubuntu-22.04

    env:
      ECCODES_DEFINITION_PATH: ${{github.workspace}}/build/share/eccodes/definitions
      PROJ_DATA: ${{github.workspace}}/build/share/proj
      PROJ_LIB: ${{github.workspace}}/build/share/proj
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent-cache/linux-code-coverage-ninja-relwithdebinfo
      FETCHCONTENT_CACHE_KEY: linux-code-coverage-ninja-relwithdebinfo

    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: ${{ runner.os }}-${{ env.FETCHCONTENT_CACHE_KEY }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'build/cmake/**', 'build/patches/**') }}

      - name: Cache vcpkg downloads (distfiles)
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-downloads-

      - name: Install system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y autoconf automake libtool pkg-config \
            lcov libgtk-3-0 libgtk-3-dev libx11-dev libx11-xcb-dev xvfb

      - name: Export GitHub Actions cache env (for vcpkg x-gha)
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure with GUI testing
        if: ${{ github.ref == 'refs/heads/ci/coverage-gui' }}
        run: cmake -B build -G Ninja
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DCMAKE_FETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=ON
             -DUSE_GUI=ON
             -DBUILD_TESTS=ON
             -DTEST_GUI=ON
             -DUSE_CODECOV=ON

      - name: Configure without GUI testing
        if: ${{ github.ref != 'refs/heads/ci/coverage-gui' }}
        run: cmake -B build -G Ninja
             -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
             -DCMAKE_FETCHCONTENT_BASE_DIR=${{env.FETCHCONTENT_BASE_DIR}}
             -DBUILD_FORECASTER=ON
             -DBUILD_OPTIMIZER=ON
             -DBUILD_DOWNSCALER=ON
             -DBUILD_VIEWER=ON
             -DUSE_GUI=ON
             -DBUILD_TESTS=ON
             -DTEST_GUI=OFF
             -DUSE_CODECOV=ON

      - name: Build and run code coverage (using xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: cmake --build build --target atmoswing-coverage
          working-directory: ${{github.workspace}}

      - name: Preparing coverage data
        working-directory: ${{github.workspace}}/build
        run: lcov --directory . --capture --output-file coverage.info

      - name: Cleaning up coverage data
        working-directory: ${{github.workspace}}/build
        run: lcov --remove coverage.info "/usr/*" "*/_deps/*" "*/tests/*" "*/vcpkg_installed/*" --output-file coverage.info

      - name: Display code coverage report
        working-directory: ${{github.workspace}}/build
        run: lcov --list coverage.info

      - uses: codecov/codecov-action@v7
        with:
          files: ${{github.workspace}}/build/coverage.info
          fail_ci_if_error: true
          verbose: true
